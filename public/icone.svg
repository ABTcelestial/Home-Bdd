<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDEDEF"/>
      <stop offset="100%" stop-color="#A8A8B0"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9A7FF"/>
      <stop offset="100%" stop-color="#7C4DE8"/>
    </linearGradient>
    <clipPath id="discD"><circle cx="256" cy="196" r="104"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0C0C0E"/>
  <!-- Disque de données : sphère mère striée -->
  <circle cx="256" cy="196" r="104" fill="#17171B"/>
  <g clip-path="url(#discD)">
    <g transform="rotate(45 256 196)">
      <rect x="110" y="110" width="300" height="14" fill="url(#steel)"/>
      <rect x="110" y="145" width="300" height="14" fill="url(#steel)"/>
      <rect x="110" y="180" width="300" height="14" fill="url(#violet)"/>
      <rect x="110" y="215" width="300" height="14" fill="url(#steel)"/>
      <rect x="110" y="250" width="300" height="14" fill="url(#steel)"/>
    </g>
  </g>
  <circle cx="256" cy="196" r="104" fill="none" stroke="url(#steel)" stroke-width="16"/>
  <!-- Arcs de pile (écho cylindre BDD) -->
  <path d="M 152,330 A 104,34 0 0 0 360,330" fill="none" stroke="url(#steel)" stroke-width="16" stroke-linecap="round"/>
  <path d="M 152,396 A 104,34 0 0 0 360,396" fill="none" stroke="url(#steel)" stroke-width="16" stroke-linecap="round"/>
</svg>
